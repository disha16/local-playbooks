name: Build desktop installers
# Native compilation and large downloads happen only after a manual request.
# Publishes workflow artifacts, never a public GitHub Release automatically.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    uses: ./.github/workflows/engine.yml
  package:
    needs: capture
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
            targetFlag: mac
            arch: arm64
          - os: windows-2022
            platform: win32-x64
            targetFlag: win
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      LP_PLATFORM: ${{ matrix.platform }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: engine-bin/${{ matrix.platform }}
      - name: Install Mac media build tools
        if: runner.os == 'macOS'
        run: brew install nasm pkg-config
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make nasm diffutils tar xz curl python
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build LGPL media tools on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg.sh
      - name: Build LGPL media tools on Mac
        if: runner.os == 'macOS'
        run: bash scripts/build-ffmpeg.sh
      - name: Stage Windows runtime libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/stage-onnx.ps1
      - name: Stage Mac license and executable permissions
        if: runner.os == 'macOS'
        run: |
          chmod +x engine-bin/darwin-arm64/playbooks-*
          curl --fail --location https://raw.githubusercontent.com/microsoft/onnxruntime/v1.22.0/LICENSE --output engine-bin/darwin-arm64/ONNXRUNTIME-LICENSE.txt
      - run: npm ci
      - run: npm test
      - run: npm run bundle:check
      - name: Build the installer
        run: npx --no-install electron-builder --${{ matrix.targetFlag }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/sources/
          if-no-files-found: error
