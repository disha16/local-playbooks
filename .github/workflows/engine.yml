name: Build capture engine
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
            features: metal
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            features: directml
    runs-on: ${{ matrix.os }}
    env:
      SCREENPIPE_SKIP_ONNX_DOWNLOAD: '1'
      AWS_LC_SYS_PREBUILT_NASM: '1'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      GGML_NATIVE: 'OFF'
      GGML_AVX512: 'OFF'
      GGML_AVX512_VBMI: 'OFF'
      GGML_AVX512_VNNI: 'OFF'
      GGML_AVX512_BF16: 'OFF'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: Install Mac tools
        if: runner.os == 'macOS'
        run: brew install pkg-config nasm
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Build recorder and model setup helper
        working-directory: engine
        shell: bash
        run: cargo build --release -p screenpipe-engine --bin playbooks-capture --bin playbooks-prepare-models --no-default-features --features ${{ matrix.features }} --target ${{ matrix.target }}
      - name: Stage executables and linked libraries
        shell: bash
        run: |
          mkdir -p engine-bin/${{ matrix.platform }}
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; else suffix=; fi
          cp engine/target/${{ matrix.target }}/release/playbooks-capture$suffix engine-bin/${{ matrix.platform }}/
          cp engine/target/${{ matrix.target }}/release/playbooks-prepare-models$suffix engine-bin/${{ matrix.platform }}/
          find engine/target/${{ matrix.target }}/release -maxdepth 1 -type f \( -name '*.dll' -o -name '*.dylib' \) -exec cp {} engine-bin/${{ matrix.platform }}/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.platform }}
          path: engine-bin/${{ matrix.platform }}
          if-no-files-found: error
